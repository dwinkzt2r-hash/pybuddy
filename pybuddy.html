<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1038"><title>PyBuddy – Daily Python</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#1b1038;--c:#2a1b57;--c2:#3a2878;--a:#ffd23f;--b:#3ee6a8;--r:#ff5d8f;--t:#f4f0ff;--m:#a99bd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:500 16px Fredoka,system-ui,sans-serif;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 0,#5b2fd155,transparent 50%),radial-gradient(circle at 95% 95%,#ff5d8f33,transparent 45%)}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px}
header div{flex:1;line-height:1.1}header small{color:var(--m)}
#hm{font-size:34px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
#hm.jump{animation:jump .7s}
@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
@keyframes jump{30%{transform:translateY(-22px) scale(1.2)}60%{transform:translateY(0) scale(.9)}}
header button{background:#ffffff18;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;color:#fff}
main{flex:1;overflow-y:auto;padding:6px 16px 90px;-webkit-overflow-scrolling:touch}
.scr{display:none}.scr.on{display:block;animation:in .4s cubic-bezier(.2,.9,.3,1.15)}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.97)}}
nav{display:flex;background:#150b2eee;backdrop-filter:blur(12px);padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ffffff18}
nav button{flex:1;background:none;border:0;color:var(--m);font:inherit;font-size:11px;padding:4px 0}
nav button i{display:block;font-style:normal;font-size:22px;transition:transform .3s}
nav button.on{color:var(--a)}nav button.on i{transform:translateY(-4px) scale(1.25)}
#fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;font-size:26px;background:linear-gradient(135deg,var(--r),#ff9a5d);box-shadow:0 6px 18px #ff5d8f66;animation:pulse 2.5s infinite;z-index:5}
@keyframes pulse{50%{box-shadow:0 6px 28px #ff5d8faa;transform:scale(1.07)}}
.card{background:linear-gradient(145deg,var(--c),var(--c2));border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 8px 22px #0006;border:1px solid #ffffff14}
.pop{animation:in .35s}
h2,h3{margin:0 0 8px}p{margin:6px 0}small{color:var(--m)}
.btn{position:relative;overflow:hidden;border:0;border-radius:16px;padding:13px 18px;font:700 16px Fredoka,sans-serif;color:#2b1700;background:linear-gradient(180deg,#ffe066,#ffb703);box-shadow:0 5px 0 #b57a00;transition:transform .1s,box-shadow .1s;margin-top:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b57a00}
.btn.g{background:linear-gradient(180deg,#5cf5c0,#18c98a);box-shadow:0 5px 0 #0b8a5c;color:#033}.btn.g:active{box-shadow:0 1px 0 #0b8a5c}
.btn.p{background:#ffffff1f;box-shadow:0 5px 0 #0004;color:var(--t)}
.btn.w{width:100%;display:block}.btn:disabled{opacity:.5}
.rip{position:absolute;border-radius:50%;background:#fff8;transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:#ffffff1a;border:2px solid transparent;color:var(--t);border-radius:30px;padding:8px 14px;font:inherit;font-size:14px;transition:.2s}
.chip.on{border-color:var(--a);background:#ffd23f33}
input,textarea{width:100%;background:#150b2e;color:var(--t);border:2px solid #ffffff22;border-radius:14px;padding:12px;font:inherit;font-size:16px;outline:0}
input:focus,textarea:focus{border-color:var(--b)}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:15px;min-height:180px;resize:vertical;tab-size:4;white-space:pre}
pre{background:#120a26;border-radius:12px;padding:10px;overflow-x:auto;font-size:13.5px;border-left:4px solid var(--b);margin:8px 0;white-space:pre}
code{background:#120a26;border-radius:6px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:.9em;color:var(--a)}pre code{color:inherit;background:none;padding:0}
.md h3{color:var(--a);margin:12px 0 4px}.md{line-height:1.55;word-break:break-word}
.bar2{height:10px;border-radius:9px;background:#ffffff22;overflow:hidden}.bar2 b{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1s cubic-bezier(.2,.8,.2,1);width:0}
.dots i{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--a);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-7px)}}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:#ffffff14;border:2px solid #ffffff22;color:var(--t);border-radius:16px;padding:13px;font:inherit;transition:.2s}
.opt:active{transform:scale(.97)}.opt.ok{background:#18c98a55;border-color:var(--b);animation:pulse2 .5s}.opt.no{background:#ff5d8f44;border-color:var(--r);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes pulse2{50%{transform:scale(1.04)}}
.kb{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.kb button{background:#ffffff22;border:0;color:var(--a);border-radius:10px;padding:8px 13px;font:700 16px ui-monospace,monospace;flex:none}
.bub{max-width:90%;padding:10px 14px;border-radius:18px;margin:8px 0;animation:in .3s}.me{margin-left:auto;background:var(--a);color:#2b1700}.bot{background:var(--c2)}
.ib{position:sticky;bottom:-84px;display:flex;gap:8px;background:var(--bg);padding:8px 0}.ib button{margin:0;padding:0 18px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}.bars div{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(0deg,var(--b),var(--a));animation:gw 1s both;min-height:4px;position:relative}
.bars div small{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px;color:#fff}
@keyframes gw{from{height:0}}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.ov.on{display:flex}.ov.mid{align-items:center;padding:16px}
.ov>.card{width:100%;max-height:85%;overflow:auto;margin:0;animation:up .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--b);color:#033;padding:10px 18px;border-radius:30px;font-weight:700;z-index:50;transition:transform .4s cubic-bezier(.2,1.4,.4,1);max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:40}
.big{font-size:44px;font-weight:700;color:var(--a)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<div id="app">
<header><span id="hm">🐍</span><div><b id="hi">PyBuddy</b><br><small id="hs">Learn Python daily</small></div><span id="sy" title="Telegram sync">☁️</span><button onclick="show('set')">⚙️</button></header>
<main>
<section id="home" class="scr on"></section><section id="learn" class="scr"></section><section id="prac" class="scr"></section>
<section id="test" class="scr"></section><section id="stats" class="scr"></section><section id="doubt" class="scr"></section><section id="set" class="scr"></section>
</main>
<button id="fab" onclick="show('doubt')">💬</button>
<nav><button data-s="home"><i>🏠</i>Home</button><button data-s="learn"><i>📖</i>Learn</button><button data-s="prac"><i>💻</i>Practice</button><button data-s="test"><i>🧪</i>Test</button><button data-s="stats"><i>📊</i>Stats</button></nav>
</div>
<div id="sh" class="ov" onclick="if(event.target==this)this.classList.remove('on')"></div>
<div id="wel" class="ov mid"><div class="card" style="text-align:center"><div style="font-size:64px;animation:bob 2s infinite;display:inline-block">🐍</div><h2>Welcome to PyBuddy!</h2><p>Your daily Python teacher. Log in once with Puter to unlock AI lessons, practice checking and progress saving.</p><button class="btn w" id="lg">🔑 Login with Puter</button><small>A login pop-up will open. Allow pop-ups if asked.</small></div></div>
<canvas id="cf"></canvas><div id="toast"></div>
<script>
/* ===== CONFIG (teacher's Telegram storage) ===== */
const TG={t:'8835604359:AAFDVBTEXWb7lwQsSMynshd3HNoOM8dG-3E',c:'-1003953146702'};
const TOP=['print() & your first program','Variables & data types','Strings & f-strings','Input & type conversion','Operators & expressions','if / elif / else','for loops & range()','while loops, break & continue','Lists','Tuples & sets','Dictionaries','Functions','Arguments, return & scope','List comprehensions','File handling','Errors & try/except','Modules & imports','Classes & objects (OOP)','Inheritance','Lambda, map & filter'];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const D=()=>new Date().toLocaleDateString('en-CA'),Y=()=>new Date(Date.now()-864e5).toLocaleDateString('en-CA');
let S=JSON.parse(localStorage.pb||'null')||{xp:0,st:0,last:'',lv:'Beginner',done:[],pr:[],ts:[],dq:0,today:null,u:'guest'};
let U=null,mid=localStorage.pbm||null,L={},P={},Z={},H=[],cur='home';
const SYS={role:'system',content:'You are PyBuddy, a fun, patient Python teacher for mobile learners. Use short sentences, friendly emojis, small code blocks, real-life analogies. Be accurate.'};
/* ===== helpers ===== */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const md=s=>esc(s).replace(/```\w*\n?([\s\S]*?)(```|$)/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^#+ (.*)$/gm,'<h3>$1</h3>').replace(/^[-*] (.*)$/gm,'• $1').replace(/\n/g,'<br>');
const tx=r=>typeof r==='string'?r:(Array.isArray(r?.message?.content)?r.message.content.map(c=>c.text||'').join(''):r?.message?.content||String(r));
async function ai(m,on){const msgs=typeof m=='string'?[SYS,{role:'user',content:m}]:[SYS,...m];const r=await puter.ai.chat(msgs,{stream:!!on});if(!on)return tx(r);let t='';for await(const p of r){t+=p?.text||'';on(t)}return t}
const js=t=>{const a=[t.indexOf('{'),t.indexOf('[')].filter(i=>i>=0);return JSON.parse(t.slice(Math.min(...a),Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'))+1))};
const dots='<span class="dots"><i></i><i></i><i></i></span>';
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
function cnt(el,to){let n=0;const i=setInterval(()=>{n+=Math.ceil(to/20)||1;if(n>=to){n=to;clearInterval(i)}el.textContent=n},35)}
function happy(){const h=$('#hm');h.classList.remove('jump');void h.offsetWidth;h.classList.add('jump');navigator.vibrate?.(40)}
function conf(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const p=Array.from({length:100},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*15,vy:-Math.random()*17-4,s:Math.random()*9+4,h:Math.random()*360,r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.45;q.r+=.2;x.fillStyle=`hsl(${q.h},90%,60%)`;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()});if(++f<120)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='rip';const d=Math.max(r.width,r.height)/4;s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
/* ===== Telegram storage ===== */
async function tg(m,p){const r=await fetch(`https://api.telegram.org/bot${TG.t}/${m}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG.c,...p})});return r.json()}
const log=t=>tg('sendMessage',{text:`${t}\n— #${S.u}`}).catch(()=>{});
let st;function save(){localStorage.pb=JSON.stringify(S);clearTimeout(st);st=setTimeout(sync,1500)}
async function sync(){$('#sy').textContent='⏳';try{if(U)await puter.kv.set('pb',JSON.stringify(S))}catch(e){}
try{const c=JSON.parse(JSON.stringify(S));let n=10,tx2;do{['done','pr','ts'].forEach(k=>c[k]=c[k].slice(-n));n-=3;tx2=`📦 PYBUDDY STATE #${S.u}\n`+JSON.stringify(c)}while(tx2.length>3900&&n>1);
let r=mid&&await tg('editMessageText',{message_id:+mid,text:tx2});
if(!r||!(r.ok||/not modified/.test(r.description||''))){r=await tg('sendMessage',{text:tx2});if(!r.ok)throw 0;mid=r.result.message_id;localStorage.pbm=mid;try{if(U)puter.kv.set('pbm',String(mid))}catch(e){}}
$('#sy').textContent='✅'}catch(e){$('#sy').textContent='⚠️'}}
async function restore(){if(!mid)return toast('No Telegram backup yet');const r=await tg('forwardMessage',{from_chat_id:TG.c,message_id:+mid}).catch(()=>({}));if(!r.ok)return toast('Restore failed');tg('deleteMessage',{message_id:r.result.message_id});try{Object.assign(S,JSON.parse(r.result.text.split('\n').slice(1).join('\n')),{u:S.u});save();show('home');toast('Restored from Telegram ✅')}catch(e){toast('Backup unreadable')}}
/* ===== auth ===== */
async function after(){try{U=await puter.auth.getUser();S.u=(U.username||'user').replace(/\W/g,'_');const k=await puter.kv.get('pb');if(k){const c=JSON.parse(k);if((c.xp||0)>=S.xp)S=Object.assign(S,c,{u:S.u})}const m=await puter.kv.get('pbm');if(m&&!mid){mid=m;localStorage.pbm=m}}catch(e){}
$('#wel').classList.remove('on');localStorage.pbv=1;show('home');save()}
$('#lg').onclick=async()=>{try{await puter.auth.signIn();await after()}catch(e){toast('Login cancelled. Tap again.')}};
async function boot(){if(typeof puter=='undefined'){toast('Puter failed to load. Check internet.');return show('home')}
if(puter.auth.isSignedIn())await after();else{$('#wel').classList.add('on');show('home')}}
/* ===== state helpers ===== */
function tdy(){if(!S.today||S.today.d!==D())S.today={d:D(),t:TOP.find(x=>!S.done.some(d=>d.t===x))||TOP[S.done.length%TOP.length],ok:0,l:0,p:0,q:0};return S.today}
function award(x){if(S.last!==D()){S.st=S.last===Y()?S.st+1:1;S.last=D()}S.xp+=x;save();toast(`+${x} XP ⭐`);happy()}
const lvl=()=>Math.floor(S.xp/100)+1;
function head(){$('#hi').textContent=`Hi ${U?.username||'friend'}! Lv ${lvl()}`;$('#hs').textContent=`🔥 ${S.st} day streak · ⭐ ${S.xp} XP`}
/* ===== navigation ===== */
function show(id){cur=id;$$('.scr').forEach(e=>e.classList.toggle('on',e.id==id));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s==id));$('#fab').style.display=id=='doubt'?'none':'block';$('main').scrollTop=0;head();R[id]()}
$$('nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));
/* ===== screens ===== */
const R={
home(){const T=tdy(),p=(T.l+T.p+T.q)/3;
$('#home').innerHTML=`<div class="card" style="text-align:center"><svg width="120" height="120" viewBox="0 0 120 120"><defs><linearGradient id="gr"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#3ee6a8"/></linearGradient></defs><circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff22" stroke-width="12"/><circle id="rg" cx="60" cy="60" r="50" fill="none" stroke="url(#gr)" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)"/><text x="60" y="68" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">${Math.round(p*100)}%</text></svg>
<p><small>Today's goal: lesson ${T.l?'✅':'⬜'} · practice ${T.p?'✅':'⬜'} · test ${T.q?'✅':'⬜'}</small></p><div class="bar2"><b style="width:${S.xp%100}%"></b></div><small>${S.xp%100}/100 XP to level ${lvl()+1}</small></div>
${T.ok?`<div class="card"><small>Today's topic</small><h2>${esc(T.t)}</h2><button class="btn g w" onclick="show('learn')">📖 Open today's lesson</button><button class="btn p w" onclick="pick()">✏️ Change topic</button></div>`
:`<div class="card pop"><h2>What should we learn today? 🤔</h2><p>I suggest:</p><div class="big" style="font-size:26px">${esc(T.t)}</div><p><small>Level: ${S.lv}</small></p><button class="btn g w" onclick="conf1()">✅ Yes, teach this!</button><button class="btn p w" onclick="pick()">✏️ Choose another topic</button></div>`}
<div class="row"><div class="card" style="text-align:center;margin:0"><div class="big">${S.st}🔥</div><small>day streak</small></div><div class="card" style="text-align:center;margin:0"><div class="big">${S.done.length}</div><small>lessons done</small></div></div>`;
setTimeout(()=>{const r=$('#rg');if(r)r.style.strokeDashoffset=314*(1-p)},80)},
learn(){const T=tdy();if(!T.ok)return $('#learn').innerHTML=`<div class="card"><h2>Confirm today's topic first 🙂</h2><button class="btn w" onclick="show('home')">Go to Home</button></div>`;
$('#learn').innerHTML=`<div class="card"><small>Today's lesson</small><h2>${esc(T.t)}</h2><button class="btn w" id="gl" onclick="lesson()">${L.t===T.t?'🔁 Re-teach me':'▶ Start lesson'}</button></div><div id="lt" class="card md" style="display:${L.t===T.t?'block':'none'}">${L.t===T.t?md(L.x):''}</div><div id="lc"></div>`;if(L.t===T.t)lc()},
prac(){const T=tdy();$('#prac').innerHTML=`<div class="card"><h2>💻 Train yourself</h2><p>AI gives a real task on <b>${esc(T.t)}</b>. You code, AI checks it.</p><button class="btn g w" onclick="chal()">🎯 New challenge</button></div><div id="pa"></div>`;if(P.task)pshow()},
test(){const T=tdy();$('#test').innerHTML=`<div class="card"><h2>🧪 Test assessment</h2><p>5 quick questions. Score ≥ 80% = confetti 🎉</p><button class="btn w" onclick="quiz(0)">📘 Today's topic</button><button class="btn p w" onclick="quiz(1)">🔀 Mixed revision</button></div><div id="tz"></div>`},
stats(){const a=[...S.pr.map(x=>({t:x.t,v:x.s})),...S.ts.map(x=>({t:x.t,v:Math.round(x.s/x.m*100)}))],av=k=>k.length?Math.round(k.reduce((s,x)=>s+x,0)/k.length):0;
const by={};a.forEach(x=>(by[x.t]=by[x.t]||[]).push(x.v));const last=a.slice(-10);
$('#stats').innerHTML=`<div class="row"><div class="card" style="text-align:center"><div class="big">${av(S.pr.map(x=>x.s))}%</div><small>practice avg</small></div><div class="card" style="text-align:center"><div class="big">${av(S.ts.map(x=>x.s/x.m*100))}%</div><small>test avg</small></div></div>
<div class="card"><h3>Recent scores</h3>${last.length?`<div class="bars">${last.map((x,i)=>`<div style="height:${Math.max(x.v,4)}%;animation-delay:${i*.08}s"><small>${x.v}</small></div>`).join('')}</div>`:'<p><small>Do a practice or test to see your chart 📈</small></p>'}</div>
<div class="card"><h3>Topic strength</h3>${Object.keys(by).length?Object.entries(by).map(([k,v])=>{const m=av(v);return`<p>${esc(k)} ${m<60?'⚠️ weak':m>=80?'💪':''}</p><div class="bar2"><b style="width:${m}%;${m<60?'background:var(--r)':''}"></b></div>`}).join(''):'<p><small>No data yet.</small></p>'}</div>
<div class="card"><h3>❓ ${S.dq} doubts asked · 📖 ${S.done.length} lessons</h3><button class="btn g w" onclick="analyze(${JSON.stringify(by).replace(/"/g,'&quot;')})">🤖 AI analysis of my progress</button><div id="an" class="md" style="margin-top:10px"></div></div>`;
setTimeout(()=>$$('.bar2 b').forEach(b=>{const w=b.style.width;b.style.width=0;requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=w))}),30)},
doubt(){$('#doubt').innerHTML=`<div class="card"><h3>💬 Ask a doubt</h3><small>Ask anything about Python. Saved for your teacher too.</small></div><div id="ch">${H.map(m=>`<div class="bub ${m.role=='user'?'me':'bot md'}">${md(m.content)}</div>`).join('')}</div><div class="ib"><input id="dq" placeholder="Type your doubt…" onkeydown="if(event.key=='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div>`},
set(){$('#set').innerHTML=`<div class="card"><h3>Level</h3><div class="chips">${['Beginner','Intermediate','Advanced'].map(l=>`<button class="chip ${S.lv==l?'on':''}" onclick="S.lv='${l}';save();R.set()">${l}</button>`).join('')}</div></div>
<div class="card"><h3>☁️ Telegram storage</h3><small>Progress is saved to your teacher's Telegram group and Puter cloud.</small><button class="btn w" onclick="sync().then(()=>toast('Synced'))">🔄 Sync now</button><button class="btn p w" onclick="restore()">📥 Restore from Telegram</button></div>
<div class="card"><h3>Account</h3><p><small>${U?'Logged in as '+esc(U.username):'Not logged in'}</small></p><button class="btn p w" onclick="out()">🚪 Logout</button><button class="btn p w" onclick="if(confirm('Erase local progress?')){localStorage.clear();location.reload()}">🗑️ Reset local data</button></div>`}};
/* ===== topic confirm ===== */
function conf1(){const T=tdy();T.ok=1;save();conf();happy();log(`🎯 Topic confirmed: ${T.t} (${S.lv})`);show('learn')}
function pick(){$('#sh').innerHTML=`<div class="card"><h3>Choose today's topic</h3><div class="chips">${TOP.map((t,i)=>`<button class="chip" onclick="setT(${i})">${esc(t)}</button>`).join('')}</div><input id="ct" placeholder="…or type your own topic"><button class="btn g w" onclick="setT(-1)">Use this topic</button></div>`;$('#sh').classList.add('on')}
function setT(i){const v=i<0?$('#ct').value.trim():TOP[i];if(!v)return toast('Type a topic');const T=tdy();T.t=v;T.ok=1;L={};P={};save();$('#sh').classList.remove('on');log(`🎯 Topic chosen: ${v}`);show('learn')}
/* ===== lesson ===== */
async function lesson(){const T=tdy(),b=$('#gl'),box=$('#lt');b.disabled=true;box.style.display='block';box.innerHTML=dots;$('#lc').innerHTML='';
try{L={t:T.t,x:''};L.x=await ai(`Teach "${T.t}" for a ${S.lv} learner. Structure: ## 🎯 Goal, ## 💡 Simple idea (with a real-life analogy), ## 🧪 Two short code examples with outputs, ## ⚠️ Common mistakes, ## 📝 3-line recap. Under 350 words.`,t=>{L.x=t;box.innerHTML=md(t)+dots;box.scrollIntoView({block:'end'})});box.innerHTML=md(L.x);lc()}catch(e){box.innerHTML='😕 AI could not respond. Check login/internet and retry.'}b.disabled=false;b.textContent='🔁 Re-teach me'}
function lc(){const T=tdy();$('#lc').innerHTML=T.l?'<button class="btn g w" onclick="show(\'prac\')">✅ Done! Go practice 💻</button>':'<button class="btn g w" onclick="fin()">🎓 I learned it! (+20 XP)</button>'}
function fin(){const T=tdy();T.l=1;S.done.push({d:D(),t:T.t});award(20);conf();log(`✅ Lesson completed: ${T.t}`);lc()}
/* ===== practice ===== */
async function chal(){const T=tdy(),a=$('#pa');a.innerHTML=`<div class="card">Thinking of a task ${dots}</div>`;try{P=js(await ai(`Create ONE small practical Python challenge on "${T.t}" for a ${S.lv} learner. Reply ONLY JSON: {"task":"...","hint":"...","starter":"# starter code"}`));P.t=T.t;P.res=null;pshow()}catch(e){a.innerHTML='<div class="card">😕 Could not create task. Retry.</div>'}}
function pshow(){$('#pa').innerHTML=`<div class="card pop md"><h3>🎯 Task</h3>${md(P.task)}<button class="btn p" onclick="this.nextElementSibling.style.display='block';this.remove()">💡 Hint</button><div style="display:none"><small>${md(P.hint||'')}</small></div></div>
<textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off">${esc(P.code??P.starter??'')}</textarea><div class="kb">${['    ',':','(',')','[',']','{','}','"',"'",'=','_','#'].map(k=>`<button onpointerdown="event.preventDefault()" onclick="ins(this.textContent)">${k=='    '?'⇥':k}</button>`).join('')}</div>
<button class="btn g w" id="ck" onclick="check()">🤖 Check with AI</button><div id="pr"></div>`;if(P.res)pres()}
function ins(s){const e=$('#code'),k=s=='⇥'?'    ':s;e.setRangeText(k,e.selectionStart,e.selectionEnd,'end');e.focus()}
async function check(){const code=$('#code').value;P.code=code;if(code.trim().length<3)return toast('Write some code first ✍️');const b=$('#ck');b.disabled=true;$('#pr').innerHTML=`<div class="card">AI is reading your code ${dots}</div>`;
try{const r=js(await ai(`Task: ${P.task}\nStudent's Python code:\n${code}\n\nEvaluate by careful reading (do not assume it ran). Reply ONLY JSON: {"score":0-100,"ok":true|false,"feedback":"short friendly markdown: what is right, what is wrong, tips","fix":"a correct solution"}`));P.res=r;const T=tdy();S.pr.push({d:D(),t:P.t,s:+r.score||0});if(!T.p&&r.score>=50)T.p=1;award(Math.max(2,Math.round(r.score/5)));if(r.score>=80)conf();log(`💻 Practice: ${P.t} — ${r.score}/100`);pres()}catch(e){$('#pr').innerHTML='<div class="card">😕 Check failed. Retry.</div>'}b.disabled=false}
function pres(){const r=P.res,c=r.score>=80?'var(--b)':r.score>=50?'var(--a)':'var(--r)';$('#pr').innerHTML=`<div class="card pop"><div class="big" style="color:${c}"><span id="sc">0</span>/100 ${r.score>=80?'🌟':r.score>=50?'👍':'💪'}</div><div class="md">${md(r.feedback||'')}</div><button class="btn p" onclick="this.nextElementSibling.style.display='block';this.remove()">👀 Show solution</button><div style="display:none"><pre>${esc(r.fix||'')}</pre></div></div>`;cnt($('#sc'),+r.score||0)}
/* ===== test ===== */
async function quiz(mix){const T=tdy(),a=$('#tz');a.innerHTML=`<div class="card">Preparing questions ${dots}</div>`;const sc=mix&&S.done.length?S.done.slice(-6).map(d=>d.t).join(', '):T.t;
try{const q=js(await ai(`Create 5 multiple-choice Python questions on: ${sc}, for a ${S.lv} learner. Reply ONLY JSON array: [{"q":"","o":["","","",""],"a":0,"e":"short explanation"}] where a is the correct option index.`));Z={qs:q.slice(0,5),i:0,sc:0,t:mix?'Mixed revision':T.t,done:0};qshow()}catch(e){a.innerHTML='<div class="card">😕 Could not build the test. Retry.</div>'}}
function qshow(){const q=Z.qs[Z.i];Z.done=0;$('#tz').innerHTML=`<div class="card pop"><div class="bar2"><b style="width:${(Z.i+1)/Z.qs.length*100}%"></b></div><small>Question ${Z.i+1} of ${Z.qs.length}</small><div class="md" style="font-size:17px;margin-top:6px">${md(q.q)}</div>${q.o.map((o,i)=>`<button class="opt" onclick="ans(${i})">${md(o)}</button>`).join('')}<div id="ex"></div></div>`;setTimeout(()=>$('.bar2 b')&&($('.bar2 b').style.width=(Z.i+1)/Z.qs.length*100+'%'),30)}
function ans(i){if(Z.done)return;Z.done=1;const q=Z.qs[Z.i],ok=i==q.a;if(ok)Z.sc++;$$('.opt').forEach((b,k)=>{if(k==q.a)b.classList.add('ok');else if(k==i)b.classList.add('no')});navigator.vibrate?.(ok?30:[60,40,60]);
$('#ex').innerHTML=`<div class="md pop" style="margin:10px 0">${ok?'🎉 Correct!':'😅 Not quite.'} ${md(q.e||'')}</div><button class="btn w" onclick="nq()">${Z.i<Z.qs.length-1?'Next ➜':'See result 🏁'}</button>`}
function nq(){Z.i++;Z.i>=Z.qs.length?tfin():qshow()}
function tfin(){const m=Z.qs.length,p=Math.round(Z.sc/m*100),T=tdy();S.ts.push({d:D(),t:Z.t,s:Z.sc,m});if(!T.q)T.q=1;award(Z.sc*8);if(p>=80)conf();log(`🧪 Test: ${Z.t} — ${Z.sc}/${m}`);
$('#tz').innerHTML=`<div class="card pop" style="text-align:center"><div style="font-size:60px">${p>=80?'🏆':p>=50?'👏':'📚'}</div><div class="big"><span id="sc">0</span>%</div><p>${Z.sc} of ${m} correct. ${p>=80?'Superb!':p>=50?'Good, keep going!':'Revise the lesson and retry.'}</p><button class="btn w" onclick="show('test')">Try again</button><button class="btn p w" onclick="show('stats')">📊 See analysis</button></div>`;cnt($('#sc'),p)}
/* ===== analysis & doubts ===== */
async function analyze(by){const b=$('#an');b.innerHTML=dots;try{await ai(`Analyze this learner's Python progress. Level ${S.lv}, streak ${S.st}, lessons done: ${S.done.map(d=>d.t).join('; ')||'none'}, average % per topic: ${JSON.stringify(by)}, doubts asked: ${S.dq}. Give: 1) strengths, 2) weak areas, 3) a 3-day plan. Be short and motivating.`,t=>b.innerHTML=md(t)+dots);b.innerHTML=b.innerHTML.replace(dots,'');log('📊 AI analysis requested')}catch(e){b.textContent='AI unavailable. Retry.'}}
async function ask(){const i=$('#dq'),v=i.value.trim();if(!v)return;i.value='';const ch=$('#ch');H.push({role:'user',content:v});ch.insertAdjacentHTML('beforeend',`<div class="bub me">${esc(v)}</div><div class="bub bot md" id="lv">${dots}</div>`);const lv=$('#lv');lv.scrollIntoView({block:'end'});
S.dq++;save();log(`❓ Doubt (${tdy().t}): ${v.slice(0,300)}`);
try{const r=await ai([{role:'system',content:`Student is learning: ${tdy().t}. Level ${S.lv}.`},...H.slice(-8)],t=>{lv.innerHTML=md(t)+dots;lv.scrollIntoView({block:'end'})});H.push({role:'assistant',content:r});lv.innerHTML=md(r)}catch(e){lv.textContent='😕 AI unavailable. Retry.'}lv.removeAttribute('id')}
async function out(){try{await puter.auth.signOut()}catch(e){}localStorage.removeItem('pbm');location.reload()}
boot();
</script></body></html>
